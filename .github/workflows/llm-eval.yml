name: LLM Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run correctness evaluation
        run: pytest deepeval_testing/test_correctness_chatbot.py -v
  safety:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run red-team and bias tests
        run: pytest deepeval_testing/test_redteam.py deepeval_testing/test_bias.py -v

